# Reconcile Azure RG tags from a SharePoint CSV.
# Auth (no secrets): one UAMI and one workload-identity federated service connection
# per tenant. The two script tasks run under the tenant A connection (SharePoint and
# mail live in tenant A); to work in tenant B the scripts request an OIDC token for the
# tenant B connection and sign in as tenant B's UAMI.

trigger: none
pr: none

schedules:
  - cron: "0 6 * * *"
    displayName: Daily tag reconciliation (06:00 UTC)
    branches:
      include:
        - main
    always: true

parameters:
  - name: whatIf
    displayName: Dry run (log only, no writes, no email)
    type: boolean
    default: true

variables:
  serviceConnectionName: "sc-finops-tags"
  sharePointHostname: "mycloudgurucom.sharepoint.com"
  sharePointSitePath: "/sites/mycloudguru"
  csvItemPath: "poc/tags.csv"
  # One "<tenantId>=<managementGroupName>" entry per tenant, separated by ','.
  # Not ';' - the AzurePowerShell task rejects ';' in scriptArguments ("Detected
  # characters in arguments that may not be executed correctly by the shell").
  tenantScopes: "c6029515-0784-4bf6-a47e-6ce74d8063b0=MCGAU,aa4a4b3b-6b92-4866-acdb-e65a044e4efa=CBRTC"
  # How to sign in to each tenant other than tenant A:
  # "<tenantId>=<client id of that tenant's UAMI>:<id of its service connection>".
  # The connection id is the resourceId GUID in the service connection's URL.
  tenantConnections: "aa4a4b3b-6b92-4866-acdb-e65a044e4efa=<tenantB-uami-client-id>:<tenantB-service-connection-id>"
  # Report email. mailTo accepts several addresses separated by ',' (not ';' - same task restriction).
  mailFrom: "admin@mycloudguru.com"
  mailTo: "shamsher.katoch@gmail.com"
  mailSubject: "Azure RG tag reconciliation"

pool:
  vmImage: windows-latest

jobs:
  - job: reconcile
    displayName: Reconcile RG tags
    timeoutInMinutes: 60
    steps:
      - checkout: self

      - task: AzurePowerShell@5
        displayName: Sync-CsvWithAzure.ps1 (append missing RGs)
        inputs:
          azureSubscription: $(serviceConnectionName)
          scriptType: FilePath
          scriptPath: FinOps/scripts/Sync-CsvWithAzure.ps1
          scriptArguments: >-
            -SharePointHostname "$(sharePointHostname)"
            -SharePointSitePath "$(sharePointSitePath)"
            -CsvItemPath "$(csvItemPath)"
            -TenantScopes "$(tenantScopes)"
            -TenantConnections "$(tenantConnections)"
            -WhatIfMode:$${{ parameters.whatIf }}
          azurePowerShellVersion: LatestVersion
          pwsh: true
          failOnStandardError: true
        # Needed to request the tenant B connection's OIDC token when switching tenant.
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - task: AzurePowerShell@5
        displayName: Invoke-TagReconciliation.ps1 (reconcile + email report)
        inputs:
          azureSubscription: $(serviceConnectionName)
          scriptType: FilePath
          scriptPath: FinOps/scripts/Invoke-TagReconciliation.ps1
          scriptArguments: >-
            -SharePointHostname "$(sharePointHostname)"
            -SharePointSitePath "$(sharePointSitePath)"
            -CsvItemPath "$(csvItemPath)"
            -TenantScopes "$(tenantScopes)"
            -TenantConnections "$(tenantConnections)"
            -WhatIfMode:$${{ parameters.whatIf }}
            -MailFrom "$(mailFrom)"
            -MailTo "$(mailTo)"
            -MailSubject "$(mailSubject)"
          azurePowerShellVersion: LatestVersion
          pwsh: true
          failOnStandardError: true
        # Needed to request the tenant B connection's OIDC token when switching tenant.
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
