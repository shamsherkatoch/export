# Reconcile Azure RG tags from a SharePoint CSV.
# Auth (no secrets): the service connection signs in as a UAMI (workload identity
# federation). The UAMI is a federated credential on a multi-tenant app registration
# homed in tenant A; the scripts use it to sign that app registration in to each
# tenant listed in tenantScopes. The app registration holds all the access.

trigger: none
pr: none

schedules:
  - cron: "0 6 * * *"
    displayName: Daily tag reconciliation (06:00 UTC)
    branches:
      include:
        - main
    always: true

parameters:
  - name: whatIf
    displayName: Dry run (log only, no writes, no email)
    type: boolean
    default: true

variables:
  serviceConnectionName: "sc-finops-tags"
  sharePointHostname: "mycloudgurucom.sharepoint.com"
  sharePointSitePath: "/sites/mycloudguru"
  csvItemPath: "poc/tags.csv"
  # Application (client) id of the multi-tenant app registration. Replace the placeholder.
  appClientId: "<app-registration-client-id>"
  # One "<tenantId>=<managementGroupName>" entry per tenant, separated by ';'.
  # Replace both placeholders with the real tenant GUIDs (and tenant B's MG) -
  # the scripts refuse to run until each tenant id is a GUID.
  tenantScopes: "<tenantA-id>=MCGAU;<tenantB-id>=<tenantB-managementGroup>"
  # Report email. mailTo accepts several addresses separated by ';' or ','.
  mailFrom: "admin@mycloudguru.com"
  mailTo: "shamsher.katoch@gmail.com"
  mailSubject: "Azure RG tag reconciliation"

pool:
  vmImage: windows-latest

jobs:
  - job: reconcile
    displayName: Reconcile RG tags
    timeoutInMinutes: 60
    steps:
      - checkout: self

      - task: AzurePowerShell@5
        displayName: Sync-CsvWithAzure.ps1 (append missing RGs)
        inputs:
          azureSubscription: $(serviceConnectionName)
          scriptType: FilePath
          scriptPath: FinOps/scripts/Sync-CsvWithAzure.ps1
          scriptArguments: >-
            -SharePointHostname "$(sharePointHostname)"
            -SharePointSitePath "$(sharePointSitePath)"
            -CsvItemPath "$(csvItemPath)"
            -TenantScopes "$(tenantScopes)"
            -AppClientId "$(appClientId)"
            -WhatIfMode:$${{ parameters.whatIf }}
          azurePowerShellVersion: LatestVersion
          pwsh: true
          failOnStandardError: true

      - task: AzurePowerShell@5
        displayName: Invoke-TagReconciliation.ps1 (reconcile + email report)
        inputs:
          azureSubscription: $(serviceConnectionName)
          scriptType: FilePath
          scriptPath: FinOps/scripts/Invoke-TagReconciliation.ps1
          scriptArguments: >-
            -SharePointHostname "$(sharePointHostname)"
            -SharePointSitePath "$(sharePointSitePath)"
            -CsvItemPath "$(csvItemPath)"
            -TenantScopes "$(tenantScopes)"
            -AppClientId "$(appClientId)"
            -WhatIfMode:$${{ parameters.whatIf }}
            -MailFrom "$(mailFrom)"
            -MailTo "$(mailTo)"
            -MailSubject "$(mailSubject)"
          azurePowerShellVersion: LatestVersion
          pwsh: true
          failOnStandardError: true
